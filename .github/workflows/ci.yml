name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript — Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, build, unit tests, and integration tests
        run: npm run verify
      - name: Install verified OPA CLI
        if: matrix.node-version == 22
        env:
          OPA_VERSION: "1.18.2"
          OPA_SHA256: "9903e5125ac281104f2c4b7371d10cc3b74a98933743fcbfc174f9bf0ab20de8"
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --output /tmp/opa \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  /tmp/opa" | sha256sum --check
          chmod 0755 /tmp/opa
      - name: Compile Rego and execute the real OPA WASM policy
        if: matrix.node-version == 22
        env:
          RISKPROOF_OPA_BIN: /tmp/opa
        run: npm run test:opa
      - name: Audit npm dependency tree
        run: npm audit --audit-level=high

  npm-package:
    name: npm package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Pack and install the exact published file set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/riskproof-pack /tmp/riskproof-install
          npm pack -w packages/riskproof --pack-destination /tmp/riskproof-pack
          npm install --prefix /tmp/riskproof-install /tmp/riskproof-pack/riskproof-*.tgz
          (
            cd /tmp/riskproof-install
            node --input-type=module -e "import('riskproof').then((m) => { if (typeof m.evaluate !== 'function') process.exit(1) })"
          )
          test -f /tmp/riskproof-install/node_modules/riskproof/dist/riskproof.schema.json
          test -f /tmp/riskproof-install/node_modules/riskproof/dist/riskproof.example.json
          /tmp/riskproof-install/node_modules/.bin/riskproof --help

  python:
    name: Python — ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: agent
    env:
      UV_FROZEN: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - name: Sync locked dependencies
        run: uv sync --extra dev --python "${{ matrix.python-version }}"
      - run: uv run ruff check src tests demo.py
      - run: uv run pytest --cov=riskproof_agent --cov-report=term-missing -q
      - run: uv run python -m compileall -q src tests demo.py
      - run: uv pip check
      - name: Audit Python dependencies
        if: matrix.python-version == '3.12'
        run: uv run pip-audit

  python-package:
    name: Python wheel & sdist smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - name: Build and inspect distributions
        working-directory: agent
        shell: bash
        env:
          UV_FROZEN: "true"
        run: |
          set -euo pipefail
          uv sync --extra dev --python 3.12
          rm -rf dist
          uv run python -m build
          uv run twine check dist/*
          whl_listing="$(unzip -l dist/*.whl)"
          echo "$whl_listing" | grep -q 'licenses/LICENSE'
          echo "$whl_listing" | grep -q 'riskproof_agent/py.typed'
          sdist_listing="$(tar -tzf dist/*.tar.gz)"
          echo "$sdist_listing" | grep -q '/LICENSE$'
          echo "$sdist_listing" | grep -q '/src/riskproof_agent/py.typed$'
      - name: Install wheel and sdist into a clean environment
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/riskproof-package-smoke
          /tmp/riskproof-package-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl
          import_output="$(/tmp/riskproof-package-smoke/bin/python -c 'import riskproof_agent')"
          test -z "$import_output"
          /tmp/riskproof-package-smoke/bin/python -m pip install --disable-pip-version-check --no-deps --force-reinstall dist/*.tar.gz
          import_output="$(/tmp/riskproof-package-smoke/bin/python -c 'import riskproof_agent')"
          test -z "$import_output"
          /tmp/riskproof-package-smoke/bin/python -m pip check

  docker:
    name: Docker build & persistence smoke
    runs-on: ubuntu-latest
    needs: [typescript]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.sidecar.yml config --quiet
      - name: Build image
        run: |
          docker build \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t riskproof:ci .
      - name: Run hardened HTTP, protected-proof, persistence, and SIGTERM smoke
        env:
          RISKPROOF_DOCKER_IMAGE: riskproof:ci
        run: npm run test:docker
