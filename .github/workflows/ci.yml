name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript — Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck tests
        run: npm run typecheck:test
      - name: Build
        run: npm run build
      - name: Unit + integration + security regression tests
        run: npm test

  npm-package:
    name: npm package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Pack and install the exact published file set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/riskproof-pack /tmp/riskproof-install
          npm pack --pack-destination /tmp/riskproof-pack
          npm install --prefix /tmp/riskproof-install /tmp/riskproof-pack/dsh-riskproof-*.tgz
          (
            cd /tmp/riskproof-install
            node --input-type=module -e "import('dsh-riskproof').then((m) => { if (typeof m.apply !== 'function') process.exit(1) })"
          )
          test -f /tmp/riskproof-install/node_modules/dsh-riskproof/cordis.patch.yml
          test -f /tmp/riskproof-install/node_modules/dsh-riskproof/dist/index.js
