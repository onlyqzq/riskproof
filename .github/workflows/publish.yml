name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release and build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Require a canonical SemVer tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must be canonical SemVer prefixed with v" >&2
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify release
        run: |
          npm ci
          npm run verify

      - name: Build npm artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          npm pack --pack-destination release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-dist
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    name: Publish npm with OIDC
    runs-on: ubuntu-latest
    needs: verify
    # Keep this job environment-free so its OIDC claims continue to match npm.
    # Deployment tracking is recorded separately after the package is visible.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-dist
          path: npm-dist
      - name: Publish verified npm tarball
        shell: bash
        run: |
          set -euo pipefail
          cd npm-dist
          shopt -s nullglob
          tarballs=(dsh-riskproof-*.tgz)
          if (( ${#tarballs[@]} != 1 )); then
            echo "Expected exactly one dsh-riskproof tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          tarball="${tarballs[0]}"
          version="${tarball#dsh-riskproof-}"
          version="${version%.tgz}"

          published_versions="$(npm view dsh-riskproof versions --json)"
          if node -e '
            const versions = JSON.parse(process.argv[1]);
            const published = Array.isArray(versions) ? versions : [versions];
            process.exit(published.includes(process.argv[2]) ? 0 : 1);
          ' "$published_versions" "$version"; then
            published_integrity="$(npm view "dsh-riskproof@${version}" dist.integrity)"
            local_integrity="$(node -e '
              const { createHash } = require("node:crypto");
              const { readFileSync } = require("node:fs");
              const digest = createHash("sha512")
                .update(readFileSync(process.argv[1]))
                .digest("base64");
              process.stdout.write(`sha512-${digest}`);
            ' "$tarball")"
            if [[ "$local_integrity" != "$published_integrity" ]]; then
              echo "dsh-riskproof@${version} is published with different contents" >&2
              exit 1
            fi
            echo "dsh-riskproof@${version} is already published — skipping publish."
            exit 0
          fi
          npm publish "./${tarball}" --access public --provenance

  record-npm-deployment:
    name: Confirm npm deployment
    runs-on: ubuntu-latest
    needs: publish-npm
    environment:
      name: npm
      url: https://www.npmjs.com/package/dsh-riskproof
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Wait for the published version to become available
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for attempt in {1..10}; do
            if published_version="$(npm view "dsh-riskproof@${version}" version 2>/dev/null)" && \
               [[ "$published_version" == "$version" ]]; then
              echo "dsh-riskproof@${version} is available on npm."
              exit 0
            fi
            echo "Waiting for dsh-riskproof@${version} to become available (${attempt}/10)..."
            sleep 3
          done
          echo "dsh-riskproof@${version} is not available on npm" >&2
          exit 1

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: record-npm-deployment
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-dist
          path: release-assets
      - name: Create release from the verified tag
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: release-assets/*
